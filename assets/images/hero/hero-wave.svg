<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Radiant Blue-to-Cyan mesh gradient -->
    <radialGradient id="waveGlow" cx="25%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#1E98EF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#1377EA" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0955C8" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#04071A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#04071A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="waveTopHighlight" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E98EF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1377EA" stop-opacity="0"/>
    </radialGradient>
    <filter id="waveSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  
  <!-- Base glowing blur -->
  <path d="M-100 550 L-100 240 C60 120, 160 130, 280 220 C380 300, 480 380, 680 480 L680 550 Z" fill="url(#waveGlow)" filter="url(#waveSoft)"/>
  
  <!-- Defined organic crest -->
  <path d="M-100 550 L-100 220 C50 110, 150 120, 270 210 C380 290, 490 370, 700 480 L700 550 Z" fill="url(#waveGlow)" opacity="0.92"/>
  
  <!-- Luminous crest highlight -->
  <path d="M-50 230 C50 120, 140 125, 250 210 C340 280, 440 350, 600 450" stroke="url(#waveTopHighlight)" stroke-width="45" filter="url(#waveSoft)" opacity="0.8"/>
</svg>
