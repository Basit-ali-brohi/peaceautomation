# Local Docker run: the site plus its own MySQL.
#   docker compose up --build   →   http://localhost:8080

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: peace_atomation
      DB_USER: peace
      DB_PASS: peace
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peace_atomation
      MYSQL_USER: peace
      MYSQL_PASSWORD: peace
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
