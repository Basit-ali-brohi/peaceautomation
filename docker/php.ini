; Runtime settings for the deployed container.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Asia/Karachi

upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M

expose_php = Off
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
