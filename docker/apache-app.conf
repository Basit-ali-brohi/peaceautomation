# Allow the project's .htaccess to take effect.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Hand the platform's environment variables to PHP (database credentials).
PassEnv PORT
PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASS
PassEnv MYSQLHOST MYSQLPORT MYSQLDATABASE MYSQLUSER MYSQLPASSWORD
PassEnv MYSQL_HOST MYSQL_PORT MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD
PassEnv MYSQL_URL DATABASE_URL JAWSDB_URL CLEARDB_DATABASE_URL
PassEnv SITE_URL

# Don't advertise the server build.
ServerTokens Prod
ServerSignature Off
ServerName localhost
